name: Générer les images des collections

on:
  push:
    branches: [main]
    paths:
      - "scripts/make_assets.py"
      - "assets.json"
      - "fonts/**"
      - ".github/workflows/assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/make_assets.py
      - name: Enregistrer les images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add genres seasons moods gifs logos titles
          git diff --cached --quiet || git commit -m "Met à jour les images des collections"
          git pull --rebase
          git push
