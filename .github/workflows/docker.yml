name: Image Docker (copies auto-hébergées)

# Construit l'image des copies Docker à chaque changement de l'addon sur main :
# ghcr.io/xnzx07/nuvio-assets:latest et :<VERSION> (lue dans worker/index.js).
# Une seule fois après la première image : la rendre publique (Packages → nuvio-assets → Package settings).
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "data/imdb-ratings.bin"
      - "catalogs.json"
      - "wrangler.toml"
      - "Dockerfile"
      - "docker/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker
  cancel-in-progress: true

jobs:
  image:
    # Pas sur les forks : chaque copie Cloudflare se met à jour par « Sync fork », pas par une image.
    if: github.repository == 'xnzx07/nuvio-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Version
        id: v
        run: echo "version=$(grep -oP 'const VERSION = "\K[0-9.]+' worker/index.js)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/xnzx07/nuvio-assets:latest
            ghcr.io/xnzx07/nuvio-assets:${{ steps.v.outputs.version }}
