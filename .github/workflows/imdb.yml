name: Notes IMDb (chaque semaine)

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_imdb_ratings.py"
  schedule:
    - cron: "41 4 * * 1"   # chaque lundi vers 6 h (heure de Paris en été)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Construire les notes
        run: python scripts/build_imdb_ratings.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imdb-ratings.bin
          git diff --cached --quiet || git commit -m "Notes IMDb du $(date +%F)"
          git pull --rebase
          git push
