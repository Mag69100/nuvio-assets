name: Liste des plateformes TMDB (France)

on:
  push:
    branches: [main]
    paths: [".github/workflows/providers.yml"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Même groupe que les autres workflows qui enregistrent sur main : un seul à la fois.
concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  list:
    # Pas sur les forks : un commit de leur part bloquerait « Sync fork ».
    if: github.repository == 'xnzx07/nuvio-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Télécharger la liste
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          mkdir -p data
          curl -sf "https://api.themoviedb.org/3/watch/providers/movie?watch_region=FR&language=fr-FR&api_key=${TMDB_API_KEY}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['results']; json.dump([{'id':p['provider_id'],'name':p['provider_name'],'logo':p['logo_path'],'rank':p.get('display_priorities',{}).get('FR')} for p in d], open('data/providers_fr.json','w'), ensure_ascii=False, indent=1)"
          curl -sf "https://api.themoviedb.org/3/discover/tv?watch_region=FR&with_watch_providers=381&sort_by=popularity.desc&language=fr-FR&api_key=${TMDB_API_KEY}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['results'][:10]; json.dump([{'id':x['id'],'name':x['name'],'backdrop':x.get('backdrop_path')} for x in d], open('data/canal_top.json','w'), ensure_ascii=False, indent=1)"
          for n in 285 1352 ; do curl -sf "https://api.themoviedb.org/3/network/$n/images?api_key=${TMDB_API_KEY}" -o data/network_$n.json || true; curl -sf "https://api.themoviedb.org/3/network/$n?api_key=${TMDB_API_KEY}" -o data/network_${n}_info.json || true; done
          curl -sf "https://api.themoviedb.org/3/search/company?query=Canal%2B&api_key=${TMDB_API_KEY}" -o data/company_canal.json || true
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/providers_fr.json data/canal_top.json data/network_*.json data/company_canal.json
          git diff --cached --quiet || git commit -m "Liste des plateformes TMDB (France)"
          # Un autre workflow a pu pousser entre-temps : trois essais.
          for essai in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            [ "$essai" = 3 ] || { echo "Envoi refusé (essai $essai sur 3), nouvel essai." >&2; sleep $((essai * 15)); }
          done
          exit 1
      - name: Signaler l'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITRE: "Échec de « ${{ github.workflow }} »"
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Une seule issue ouverte par workflow : les échecs suivants s'y ajoutent en commentaire.
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                  --jq '.[] | select(.title == env.TITRE) | .number' | head -n 1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Nouvel échec : $LIEN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITRE" --body "Le workflow a échoué : $LIEN"
          fi
