# Copie auto-hébergée du Catalogue FR. Lancer : docker compose up -d
# Ensuite : le site sur http://<adresse-du-serveur>:8787, l'addon sur http://<adresse-du-serveur>:8787/manifest.json
# Mettre à jour : docker compose pull && docker compose up -d
services:
  catalogue-fr:
    image: ghcr.io/xnzx07/nuvio-assets:latest
    restart: unless-stopped
    ports:
      # Ouvert au réseau de la maison (la TV s'y connecte, en http). Si tout passe par Cloudflare Tunnel ou
      # un proxy https sur cette machine, mets plutôt "127.0.0.1:8787:8787" : plus rien ne circule en clair.
      - "8787:8787"
    environment:
      TMDB_API_KEY: "ta-cle-tmdb"                 # obligatoire : themoviedb.org → Paramètres → API (clé v3)
      ADMIN_PASSWORD: "choisis-un-mot-de-passe"   # à changer, 10 caractères au moins : espace hébergeur (salle 2)
      # GEMINI_API_KEY: ""                        # facultatif : clé Gemini de ta copie (aistudio.google.com/apikey)
      # GEMINI_PUBLIC: "on"                       # facultatif : cette clé sert aussi aux liens sans clé (famille)
      # ADRESSE_PUBLIQUE: "https://catalogue.ton-domaine.fr"   # si tu passes par Cloudflare Tunnel ou un proxy https
    volumes:
      - ./donnees:/data
    logging:
      options:
        max-size: "1m"
        max-file: "3"
